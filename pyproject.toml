[project]
name = "url-shortener"
version = "0.1.0"
description = "An API that shortens links and provides statistics on them."
authors = [
    {name = "progname",email = "kalaevkirill32@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "fastapi[standart] (>=0.143.0,<0.144.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "fastapi-cache (>=0.1.0,<0.2.0)",
    "asyncpg (>=0.32.0,<0.33.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
